[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "multimedia-video-rag"
version = "0.1.0"
description = "Offline ingestion artifacts for an AIC multimedia video retrieval project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pandas>=2.2,<3", "pyarrow>=17,<22"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/multimedia_video_rag"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
