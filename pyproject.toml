[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "multimedia-video-rag"
version = "0.1.0"
description = "Text-to-video moment retrieval research on AIC 2026 keyframes with SigLIP 2 and BEiT-3"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["huggingface-hub>=0.35,<2", "pandas>=2.2,<3", "pyarrow>=17,<22"]

[project.optional-dependencies]
retrieval = ["faiss-cpu>=1.9,<2", "numpy>=1.26,<3", "safetensors>=0.4,<1"]
# Query-time text encoders; versions follow the ingest notebooks (SigLIP 2, BEiT-3).
query = [
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "transformers==4.57.1",
    "sentencepiece>=0.2,<1",
    "timm==0.9.16",
]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    "faiss-cpu>=1.9,<2",
    "numpy>=1.26,<3",
    "safetensors>=0.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multimedia_video_rag"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
